services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: tesselite
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq.conf.sample:/etc/rabbitmq/conf.d/rabbitmq.conf
    networks:
      tesselite-network:
        ipv4_address: 10.30.0.2

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 3600 10000 --loglevel warning --requirepass tesselite
    volumes:
      - redis:/data
    networks:
      tesselite-network:
        ipv4_address: 10.30.0.5

  gcp:
    image: google/cloud-sdk:emulators
    container_name: gcp
    command: gcloud beta emulators pubsub start --project=tesselite-dev --host-port='0.0.0.0:8085'
    ports:
      - '8085:8085'
    networks:
      tesselite-network:
        ipv4_address: 10.30.0.8

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - '9092:9092'
    networks:
      tesselite-network:
        ipv4_address: 10.30.0.9


networks:
  tesselite-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/24

volumes:
  redis:
    driver: local
  rabbitmq:
